spring.config.import=file:.env[.properties]
spring.application.name=ost-expo-game
server.port=26201

spring.datasource.url=jdbc:mysql://${DATABASE_HOST}/ost-expo
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.mongodb.host=${MONGODB_HOST}
spring.mongodb.port=${MONGODB_PORT}
spring.mongodb.database=${MONGODB_DATABASE}
spring.mongodb.username=${MONGODB_USER}
spring.mongodb.password=${MONGODB_PASSWORD}
spring.mongodb.authentication-database=admin

kurrentdb.host=${KURRENTDB_HOST}
kurrentdb.port=${KURRENTDB_PORT}
kurrentdb.username=${KURRENTDB_USERNAME}
kurrentdb.password=${KURRENTDB_PASSWORD}